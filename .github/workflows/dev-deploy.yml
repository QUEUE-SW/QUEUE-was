name: Dev Server Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ application-dev.yml 생성
      - name: Create application-dev.yml
        run: |
          cd src/main/resources
          touch ./application-dev.yml
          echo "${{ secrets.QUEUE_DEV }}" >> ./application-dev.yml
        shell: bash

      # 4️⃣ BootJar 생성
      - name: Build Spring Boot Jar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      # 5️⃣ Docker Hub 로그인
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 6️⃣ Docker 이미지 빌드 (queue-was)
      - name: Build Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/queue-was-dev:latest -f Dockerfile.dev .

      # 7️⃣ Docker 이미지 푸시
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/queue-was-dev:latest

      # 8️⃣ EC2 SSH 접속 및 배포
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          password: ${{ secrets.AWS_EC2_PASSWORD }}
          script: |
            echo "🛑 기존 컨테이너 종료 및 삭제"
            docker stop queue-was-dev || true
            docker rm queue-was-dev || true

            echo "⬇️ 최신 이미지 pull"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/queue-was-dev:latest

            echo "🚀 새 컨테이너 실행"
            docker run -d --name queue-was-dev --network my-network -p 8081:8081 ${{ secrets.DOCKERHUB_USERNAME }}/queue-was-dev:latest
            
            docker logs -f queue-was-dev > /home/ubuntu/logs/queue/queue-dev-$(date +%F).log 2>&1 &